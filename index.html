<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один вечер в английском пабе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a visual novel. Pub backdrop, characters standing in a row, a glass stage panel for mini-games,
   and a dialogue box at the bottom with big readable text. */
:root{
  --wall:#2a1a10; --wall2:#4b3020; --wood:#8a5a30; --cream:#fff6e3; --paper:#f6e9cf;
  --brass:#f0bd62; --ale:#eda63b; --ok:#a8dc8c; --no:#ff8f6b; --ink:#2a1706;
  --panel:rgba(30,18,10,.80); --line:rgba(255,236,200,.26); --muted:#e0cfae;
  --glow:rgba(255,196,110,.35);
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Nunito','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
html{overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--wall);color:var(--cream);font-family:var(--body);font-weight:500;font-size:clamp(17px,1.5vw,21px);line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance}
h2{font-size:1.7em}h3{font-size:1.2em;color:var(--brass)}
p{text-wrap:pretty}

#scene{position:fixed;inset:0;z-index:0}
#scene svg{width:100%;height:100%;display:block}
#scene .glow{transition:fill .8s}
#app{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden;max-width:100vw}
#app>*{min-width:0;max-width:100%}

/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px clamp(12px,2vw,28px);background:linear-gradient(180deg,rgba(20,10,4,.78),transparent)}
#chtitle{font-family:var(--display);font-weight:700;font-size:1.05em;min-width:0}
#chtitle small{display:block;font-family:var(--body);font-weight:700;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
#pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#pills button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,246,227,.08);font-weight:800;font-size:.8em;padding:0}
#pills button.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
#pills button.done{border-color:var(--ok);color:var(--ok)}
#stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-weight:700;min-width:0;max-width:100%}
#hearts{display:flex;gap:3px}
#hearts svg{width:20px;height:20px;transition:transform .2s}
#hearts .off path{fill:rgba(255,246,227,.15)}
#hearts path{fill:#ff6a5a}
.pop{position:fixed;font-weight:800;color:var(--ok);pointer-events:none;animation:up 1s forwards;z-index:30;text-shadow:0 2px 6px #000}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.chip-btn{border:1px solid var(--line);background:rgba(255,246,227,.1);border-radius:999px;padding:.25em .9em;font-weight:700;font-size:.85em}
.chip-btn:hover{border-color:var(--brass)}

/* area */
#area{position:relative;min-height:0}
#cast{position:absolute;inset:0;pointer-events:none}
.ch{position:absolute;bottom:-4px;width:clamp(110px,15vw,190px);transform-origin:bottom center;transition:left .6s,right .6s,transform .5s,filter .4s,opacity .4s;filter:brightness(.72)}
.ch svg{width:100%;display:block;overflow:visible}
.ch.talk{filter:none;transform:translateY(-6px)}
.ch[data-pos=l]{left:6%}.ch[data-pos=l2]{left:22%}.ch[data-pos=m]{left:50%;margin-left:calc(clamp(110px,15vw,190px)/-2)}
.ch[data-pos=r2]{right:22%}.ch[data-pos=r]{right:6%}
.staged .ch{transform:scale(.62)}.staged .ch.talk{transform:scale(.66) translateY(-4px)}
.ch .brow{transition:transform .25s}.ch.brow-up .brow{transform:translateY(-6px)}
#sw{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:10px clamp(10px,2vw,24px);pointer-events:none}
#stage,#ov .box{overflow-x:hidden}
#stage{display:none;pointer-events:auto;width:min(780px,100%);max-height:100%;overflow:auto;padding:clamp(14px,2vw,26px);background:var(--panel);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 50px rgba(0,0,0,.5)}
.cap{color:var(--muted);font-size:.9em}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{background:rgba(255,246,227,.12);border:1px solid var(--line);border-radius:999px;padding:.55em 1.2em;font-weight:700;transition:transform .15s,border-color .2s,background .2s}
.btn:hover{border-color:var(--brass);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,#f7cd7c,#dd9a35);color:var(--ink);border-color:#fbe0a8}
.btn.sel{background:rgba(240,189,98,.3);border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}

/* dialogue */
#dlg{position:relative;margin:0 auto 14px;width:min(1040px,calc(100% - 24px));padding:14px 20px 14px;background:rgba(26,15,8,.90);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.55);cursor:pointer;min-height:132px}
#name{display:inline-block;font-family:var(--display);font-weight:800;font-size:.95em;padding:.1em .8em;border-radius:999px;margin-bottom:6px;color:var(--ink);background:var(--brass)}
#name[data-w=kate]{background:#7fd0d6}#name[data-w=you]{background:#f3a65c}#name[data-w=jim]{background:#d9d2c0}#name[data-w=us]{background:#8fb5ee}#name[data-w=fr]{background:#f1b6bf}#name[data-w=dave]{background:#9fcf86}#name[data-w=sue]{background:#d3a6e6}#name[data-w=bob]{background:#b4c0cc}
#txt{font-size:1.08em;line-height:1.6;min-height:3.2em}
#txt.narr{font-style:italic;color:var(--muted)}
#more{position:absolute;right:18px;bottom:10px;color:var(--brass);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,246,227,.10);border:1px solid var(--line);border-radius:12px;padding:.6em .9em;font-weight:700;line-height:1.35;transition:background .2s,border-color .2s,transform .15s}
.opt i{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--brass);color:var(--ink);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:.85em}
.opt:hover{background:rgba(240,189,98,.22);border-color:var(--brass);transform:translateX(3px)}

/* effects */
body.good #scene{animation:gl .5s}body.bad #scene{animation:rd .5s}
@keyframes gl{50%{filter:brightness(1.25) saturate(1.2)}}@keyframes rd{25%,75%{filter:brightness(.8) sepia(.5) hue-rotate(-30deg)}}
body.bad #hearts{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* overlay */
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 35%,rgba(60,35,18,.55),rgba(14,7,3,.9))}
#ov .box{width:min(860px,100%);max-height:100%;overflow:auto;padding:clamp(18px,3vw,40px);background:rgba(30,18,10,.88);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px}
#ov h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;text-wrap:balance}
.tag{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.7em;color:var(--brass)}
.lead{font-size:1.1em}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu button{border:1px solid var(--line);background:rgba(255,246,227,.08);border-radius:10px;padding:.5em .7em;text-align:left;font-weight:700;font-size:.85em}
.menu button:hover{border-color:var(--brass)}
.menu button b{color:var(--brass);margin-right:.4em}
.cx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cx div{background:rgba(255,246,227,.08);border:1px solid var(--line);border-radius:12px;padding:.7em .9em;font-size:.88em}
.cx h4{font-family:var(--display);color:var(--brass);margin-bottom:.2em;font-size:1.05em}

/* mini-game bits */
.q{position:relative;height:260px;border-radius:12px;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.35));overflow:hidden}
.q .counter{position:absolute;left:0;right:0;top:0;height:36px;background:linear-gradient(180deg,#a9733f,#6e4524);border-bottom:3px solid var(--brass)}
.who{position:absolute;width:34px;height:52px;color:var(--paper);transition:left 1s cubic-bezier(.3,.7,.2,1),top 1s cubic-bezier(.3,.7,.2,1),opacity .8s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.who svg{width:100%;height:100%;fill:currentColor}.who.me{color:var(--ale)}
.who.served{top:44px!important;opacity:0}
.who .n{position:absolute;top:-12px;left:50%;transform:translateX(-50%) scale(0);background:var(--brass);color:var(--ink);font-weight:800;font-size:12px;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;transition:transform .3s}
.showq .who .n{transform:translateX(-50%) scale(1)}
.who .bang{position:absolute;top:-24px;left:100%;font-weight:800;color:var(--no);opacity:0;transition:opacity .3s}
.frown .who:not(.me) .bang{opacity:1}
.barman{position:absolute;left:50%;top:4px;width:34px;height:52px;margin-left:-17px;color:#d3dbc8;z-index:2;transition:transform .5s}
.barman svg{width:100%;height:100%;fill:currentColor}.barman.away{transform:translateX(70px)}
.zone{cursor:pointer;transition:fill .2s,stroke .2s;fill:rgba(255,244,222,.08);stroke:rgba(255,244,222,.4);stroke-dasharray:5 4}
.zone:hover{fill:rgba(240,189,98,.32);stroke:var(--brass);stroke-dasharray:none}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.chip{border:1px solid var(--line);background:rgba(255,246,227,.08);border-radius:12px;padding:.6em .9em;text-align:left;font-weight:700;transition:background .2s}
.chip.sel{background:rgba(240,189,98,.3);border-color:var(--brass)}
.faces{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,246,227,.08);border-radius:14px;padding:.7em;font-weight:700;font-size:.85em;text-align:center}
.face:hover{border-color:var(--brass)}.face svg{width:84px}
.gz-track{position:relative;height:22px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);margin:14px 0}
.gz-zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:rgba(168,220,140,.45);border-radius:99px}
.gz-mark{position:absolute;top:-4px;width:8px;height:30px;margin-left:-4px;border-radius:4px;background:var(--brass)}
.eye .pupil{transition:none}.eye .brw{transition:transform .3s}.eye.up .brw{transform:translateY(-14px)}
.meter{height:18px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9992f,#fbe0a8);transition:width .6s}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:2.6em;margin:8px 0}
.chain .c{padding:.2em .7em;border-radius:99px;background:rgba(240,189,98,.28);border:1px solid var(--brass);font-weight:700;animation:pp .3s both}
.chain .a{color:var(--brass)}@keyframes pp{from{transform:scale(.4);opacity:0}}
.said{min-height:3em;padding:.6em .9em;border-radius:10px;background:rgba(0,0,0,.3);border-left:3px solid var(--brass);margin:8px 0}
.rings{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.ring{position:relative;width:190px;height:190px}.ring svg{width:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .bg{stroke:rgba(255,246,227,.15)}
.ring .fg{stroke:var(--brass);stroke-dasharray:314;stroke-dashoffset:314;transition:stroke-dashoffset 1.6s cubic-bezier(.3,.7,.2,1)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.6em}
.ring .v small{font-family:var(--body);font-weight:700;font-size:.52em;color:var(--muted);max-width:6.2em;text-align:center;line-height:1.2}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.flip{min-height:130px;border:1px solid var(--line);border-radius:14px;background:rgba(255,246,227,.08);padding:.8em;text-align:left;font-size:.9em}
.flip b{display:block;font-family:var(--display);color:var(--brass);font-size:1.1em;margin-bottom:.3em}
.flip.open{background:rgba(240,189,98,.18);border-color:var(--brass)}
.glasses{display:flex;gap:4px;justify-content:center}
.glasses button{background:none;border:0;width:19%;padding:0;position:relative}
.glasses svg{width:100%;transition:transform .25s}.glasses button:hover svg{transform:translateY(-6px)}
.glasses b{position:absolute;left:0;right:0;bottom:22%;font-family:var(--display);font-size:1.6em;color:var(--ink);pointer-events:none}
.pint .ale{fill:var(--ale)}.pint .foam{fill:#fff4da}
.pint .gl{fill:rgba(255,255,255,.1);stroke:rgba(255,244,222,.8);stroke-width:2.5;stroke-linejoin:round}
.pint .fill{transform-origin:60px 168px;transform:scaleY(var(--f,1));transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.pint .bub{fill:rgba(255,244,218,.6);animation:rise 3s linear infinite}.pint .bub:nth-of-type(2){animation-delay:-1s}.pint .bub:nth-of-type(3){animation-delay:-2s}
@keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(-90px);opacity:0}}
.cheers g.g1,.cheers g.g2{transition:transform .35s cubic-bezier(.5,0,.3,1.4);transform-origin:50% 100%;transform-box:fill-box}
.clink .g1{transform:translateX(22px) rotate(9deg)}.clink .g2{transform:translateX(-22px) rotate(-9deg)}
.spark{opacity:0;transform-origin:center;transform-box:fill-box}.clink .spark{animation:sp .8s .25s both}
@keyframes sp{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8)}}
input[type=range]{width:100%;accent-color:var(--brass);margin:12px 0}
canvas{width:auto;max-width:100%;max-height:32vh;margin:0 auto;border-radius:12px;background:rgba(0,0,0,.3);display:block}
.score-big{font-family:var(--display);font-weight:800;font-size:2.4em;color:var(--brass)}

@media (max-width:760px){
  #pills{display:none}
  .ch{width:96px}
  #hud{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pers" viewBox="0 0 40 62"><circle cx="20" cy="12" r="10"/><path d="M3 62 Q3 27 20 27 Q37 27 37 62 Z"/></symbol>
</svg>

<div id="scene" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241409"/><stop offset="1" stop-color="#4d3220"/></linearGradient>
      <linearGradient id="cnt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87238"/><stop offset="1" stop-color="#5e3a1c"/></linearGradient>
      <radialGradient id="lg"><stop offset="0" stop-color="#ffd58a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#wall)"/>
    <g id="panels"></g>
    <rect y="170" width="1600" height="10" fill="#7b4f2c"/><rect y="270" width="1600" height="10" fill="#7b4f2c"/>
    <g id="bottles"></g>
    <g id="lamps"></g>
    <rect y="600" width="1600" height="26" fill="#d9a653"/>
    <rect y="620" width="1600" height="300" fill="url(#cnt)"/>
    <g id="cpanels" stroke="rgba(0,0,0,.35)" stroke-width="3"></g>
  </svg>
</div>

<div id="app">
  <header id="hud">
    <div id="chtitle"><small id="chnum"></small><span id="chname"></span></div>
    <div id="pills"></div>
    <div id="stats">
      <span id="hearts" title="Терпение бармена"></span>
      <span>Английскость <b id="score">0</b></span>
      <button class="chip-btn" id="cxBtn" type="button">Блокнот Кейт <b id="cxN">0</b>/10</button>
    </div>
  </header>
  <section id="area">
    <div id="cast"></div>
    <div id="sw"><div id="stage"></div></div>
  </section>
  <footer id="dlg">
    <span id="name"></span>
    <p id="txt"></p>
    <div id="choices"></div>
    <span id="more" style="visibility:hidden">&#9654;</span>
  </footer>
</div>
<div id="ov" role="dialog" aria-modal="true"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var tok=0;
var S={score:0,hearts:3,codex:[],ch:-1};
var NAMES={narr:'',you:'Вы',kate:'Кейт Фокс',jim:'Джим, бармен',us:'Американец',fr:'Француз',dave:'Дейв',sue:'Сью',bob:'Боб'};
var TITLES=['Ожидание','Стойка','Невидимая очередь','Пантомима','Please и thanks','And one for yourself?','Лицемерие?','Завсегдатаи','Спор','Финал'];
function pr(fn){var t=tok;return new Promise(function(res){fn(function(v){if(t===tok)res(v)})})}
function never(){return new Promise(function(){})}
function sleep(ms){var t=tok;return new Promise(function(r){setTimeout(function(){if(t===tok)r()},ms)})}

/* ---------- backdrop ---------- */
(function(){
  var b='',i,c=['#7a3b1e','#2f5d3a','#8a6a2a','#3b4f7a','#6d2b2b','#4a6a5a'];
  for(i=0;i<34;i++){var x=40+i*46,h=50+(i*37)%36,col=c[i%c.length];
    b+='<rect x="'+x+'" y="'+(170-h)+'" width="22" height="'+h+'" rx="5" fill="'+col+'" opacity=".85"/><rect x="'+(x+7)+'" y="'+(170-h-16)+'" width="8" height="18" rx="2" fill="'+col+'" opacity=".85"/>';
    var h2=40+(i*53)%40;b+='<rect x="'+(x+8)+'" y="'+(270-h2)+'" width="22" height="'+h2+'" rx="5" fill="'+c[(i+2)%c.length]+'" opacity=".75"/>';}
  $('#bottles').innerHTML=b;
  var p='';for(i=0;i<20;i++)p+='<rect x="'+(i*84)+'" y="330" width="80" height="270" fill="'+(i%2?'#3d2615':'#44291a')+'"/>';
  $('#panels').innerHTML=p;
  var l='';[300,800,1300].forEach(function(x){l+='<circle class="glow" cx="'+x+'" cy="150" r="260" fill="url(#lg)"/><line x1="'+x+'" y1="0" x2="'+x+'" y2="70" stroke="#c8963e" stroke-width="3"/><path d="M'+(x-46)+' 120 Q'+x+' 40 '+(x+46)+' 120Z" fill="#c8963e"/><ellipse cx="'+x+'" cy="122" rx="22" ry="8" fill="#fff0c0"/>'});
  $('#lamps').innerHTML=l;
  var cp='';for(i=0;i<9;i++)cp+='<rect x="'+(i*190+10)+'" y="650" width="170" height="240" rx="6" fill="rgba(0,0,0,.12)"/>';
  $('#cpanels').innerHTML=cp;
})();

/* ---------- characters ---------- */
var CH={you:{skin:'#f1c9a0',hair:'#5a3a22',shirt:'#e9822f'},kate:{skin:'#f3d2b3',hair:'#9a3f1f',shirt:'#2f7f86'},jim:{skin:'#e8b98f',hair:'#3a2a20',shirt:'#cfc8b4'},
  us:{skin:'#f0c39a',hair:'#c79a3a',shirt:'#3d6fb5'},fr:{skin:'#ecc3a0',hair:'#2b2b2b',shirt:'#f4f1ea'},dave:{skin:'#e3b088',hair:'#8a8a8a',shirt:'#4f7a3f'},
  sue:{skin:'#f1cfb2',hair:'#cfcfcf',shirt:'#8a55a8'},bob:{skin:'#efc9a8',hair:'#6b5a46',shirt:'#55606b'}};
